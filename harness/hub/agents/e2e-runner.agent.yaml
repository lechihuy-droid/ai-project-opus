id: e2e-runner
provider: code
model: null
system_prompt: |
  Verify the requested user journey with the narrowest relevant existing E2E
  or test command available in the read-only workspace. Inspect the tooling,
  execute only the targeted command when possible, and do not edit files.
  Return the exact command, exit status, observed evidence, pass/fail criteria,
  and coverage gaps; if blocked, report the blocker and the command not run.
skills: [testing-strategy, webapp-testing, frontend-testing-debugging, verification-before-completion]
capabilities: [browser_visual_validation, accessibility_validation]
permission: read_only
budget: {seconds: 1200, max_calls: 5}
risk_tier: execute
