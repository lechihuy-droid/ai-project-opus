<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Chạy custom graph</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 800px;
    margin: 2rem auto;
    padding: 0 1rem;
    line-height: 1.5;
  }
  nav a { margin-right: 1rem; }
  button, input {
    font-size: 1rem;
    padding: 0.5rem 0.8rem;
    border-radius: 6px;
    border: 1px solid #888;
  }
  button { cursor: pointer; background: #f0f0f0; color: #111; }
  button:hover { background: #e0e0e0; }
  .badge {
    display: inline-block;
    padding: 0.15rem 0.6rem;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .badge.interrupted { background: #fff3cd; color: #7a5b00; }
  .badge.done { background: #d1f7d6; color: #14532d; }
  pre {
    background: #f5f5f5;
    color: #111;
    padding: 0.75rem;
    border-radius: 6px;
    overflow-x: auto;
    max-height: 300px;
  }
  #status-panel { display: none; margin-top: 1.5rem; }
  .resume-row { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
</style>
</head>
<body>
<nav><a href="/builder">← Danh sách graph</a></nav>
<h1>Chạy custom graph</h1>
<p>Graph: <strong id="graph-name"></strong> (<code id="graph-id"></code>)</p>
<button id="start-btn">Bắt đầu run mới</button>

<div id="status-panel">
  <h2>Run: <code id="thread-id"></code> <span id="status-badge" class="badge"></span></h2>
  <p>Node hiện tại: <code id="current-node"></code></p>
  <p>Checkpoints đã lưu: <strong id="checkpoints"></strong></p>

  <div id="interrupt-area" style="display:none">
    <p>Graph đang dừng chờ quyết định. Payload từ <code>interrupt()</code>:</p>
    <pre id="interrupt-json"></pre>
    <div class="resume-row">
      <input id="decision-input" type="text" placeholder="vd: APPROVE, REJECT, hoặc bất kỳ chuỗi nào">
      <button id="resume-btn">Resume</button>
    </div>
  </div>

  <div id="result-area" style="display:none">
    <h3>State cuối cùng</h3>
    <pre id="result-json"></pre>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const graphId = params.get('graph_id') || 'rd_bd';
let currentThreadId = null;

document.getElementById('graph-id').textContent = graphId;

async function loadGraphInfo() {
  const res = await fetch(`/api/graphs/${graphId}`);
  if (!res.ok) {
    document.getElementById('graph-name').textContent = '(không tìm thấy graph)';
    return;
  }
  const data = await res.json();
  document.getElementById('graph-name').textContent = data.name;
}

function render(data) {
  currentThreadId = data.thread_id;
  document.getElementById('status-panel').style.display = 'block';
  document.getElementById('thread-id').textContent = data.thread_id;
  document.getElementById('checkpoints').textContent = data.checkpoints;
  document.getElementById('current-node').textContent = data.current_node || '(đã kết thúc)';

  const badge = document.getElementById('status-badge');
  badge.textContent = data.status;
  badge.className = 'badge ' + data.status;

  const interruptArea = document.getElementById('interrupt-area');
  const resultArea = document.getElementById('result-area');

  if (data.status === 'interrupted') {
    interruptArea.style.display = 'block';
    resultArea.style.display = 'none';
    document.getElementById('interrupt-json').textContent = JSON.stringify(data.interrupt, null, 2);
    document.getElementById('decision-input').value = '';
  } else {
    interruptArea.style.display = 'none';
    resultArea.style.display = 'block';
    document.getElementById('result-json').textContent = JSON.stringify(data.result, null, 2);
  }
}

async function startRun() {
  const res = await fetch(`/api/graphs/${graphId}/runs`, { method: 'POST' });
  if (!res.ok) {
    alert('Lỗi khi bắt đầu run: ' + res.statusText);
    return;
  }
  const data = await res.json();
  render(data);
}

async function resume() {
  const decision = document.getElementById('decision-input').value;
  const res = await fetch(`/api/graphs/${graphId}/runs/${currentThreadId}/resume`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ decision }),
  });
  if (!res.ok) {
    const err = await res.json();
    alert('Lỗi: ' + JSON.stringify(err.detail || res.statusText));
    return;
  }
  const data = await res.json();
  render(data);
}

document.getElementById('start-btn').addEventListener('click', startRun);
document.getElementById('resume-btn').addEventListener('click', resume);

loadGraphInfo();
</script>
</body>
</html>
