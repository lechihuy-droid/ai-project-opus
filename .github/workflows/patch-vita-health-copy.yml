name: Patch Vita Health Copy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-copy:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Localize health coach copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('health-app/dashboard.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              "Diagnosis: ${coach.topSummary}.": "Tình trạng: ${coach.topSummary}.",
              "Next action: ${insight.nextAction}": "Việc nên làm tiếp theo: ${insight.nextAction}",
              "Hành động tiếp theo: ${insight.nextAction}": "Việc nên làm tiếp theo: ${insight.nextAction}",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          if 'Diagnosis:' in s or 'Next action:' in s or 'Hành động tiếp theo:' in s:
              raise SystemExit('Copy patch incomplete')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate JavaScript parse
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('health-app/dashboard.html').read_text(encoding='utf-8')
          start = html.index('<script>') + len('<script>')
          end = html.rindex('</script>')
          Path('/tmp/dashboard.js').write_text(html[start:end], encoding='utf-8')
          PY
          node --check /tmp/dashboard.js
      - name: Remove temporary workflow
        run: rm .github/workflows/patch-vita-health-copy.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health-app/dashboard.html .github/workflows/patch-vita-health-copy.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: localize Vita health coach copy"
          git push
