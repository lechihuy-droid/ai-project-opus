name: Patch Vita Health Copy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-copy:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Localize health coach copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('health-app/dashboard.html')
          s = p.read_text(encoding='utf-8')
          old1 = "<div class=\"hero-cal-diagnosis\">${esc(`Diagnosis: ${coach.topSummary}.`)}</div>"
          new1 = "<div class=\"hero-cal-diagnosis\">${esc(`Tình trạng: ${coach.topSummary}.`)}</div>"
          old2 = "<div class=\"ih-next\">${esc(`Next action: ${insight.nextAction}`)}</div>"
          new2 = "<div class=\"ih-next\">${esc(`Việc nên làm tiếp theo: ${insight.nextAction}`)}</div>"
          missing = [x for x in (old1, old2) if x not in s]
          if missing:
              raise SystemExit(f'Missing expected copy targets: {missing}')
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate JavaScript parse
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('health-app/dashboard.html').read_text(encoding='utf-8')
          start = html.index('<script>') + len('<script>')
          end = html.rindex('</script>')
          Path('/tmp/dashboard.js').write_text(html[start:end], encoding='utf-8')
          PY
          node --check /tmp/dashboard.js
      - name: Remove temporary workflow
        run: rm .github/workflows/patch-vita-health-copy.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health-app/dashboard.html .github/workflows/patch-vita-health-copy.yml
          git commit -m "fix: localize Vita health coach copy"
          git push
