name: Sync dashboard to opus-vita

on:
  push:
    branches: [main]
    paths:
      - 'health-app/dashboard.html'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push to opus-vita
        env:
          TOKEN: ${{ secrets.VITA_DEPLOY_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          git clone https://x-access-token:${TOKEN}@github.com/lechihuy-droid/opus-vita.git /tmp/opus-vita

          cp health-app/dashboard.html /tmp/opus-vita/index.html

          cd /tmp/opus-vita
          git add index.html
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "sync: update dashboard from ai-project-opus"
          git push
