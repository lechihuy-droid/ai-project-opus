name: Sync dashboard to opus-vita

on:
  push:
    branches: [main]
    paths:
      - 'health-app/dashboard.html'
      - '.github/opus-vita-deploy-pages.yml'
      - '.github/workflows/sync-dashboard.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push to opus-vita
        env:
          TOKEN: ${{ secrets.VITA_DEPLOY_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          git clone https://x-access-token:${TOKEN}@github.com/lechihuy-droid/opus-vita.git /tmp/opus-vita

          # 1. Dashboard → index.html
          cp health-app/dashboard.html /tmp/opus-vita/index.html

          # 2. Assets (SVG, icons…)
          cp -r health-app/assets /tmp/opus-vita/assets

          # 3. .nojekyll — Pages bỏ qua bước Build with Jekyll, serve file nguyên trạng
          touch /tmp/opus-vita/.nojekyll

          cd /tmp/opus-vita
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "sync: dashboard + static Pages deploy from ai-project-opus"
          git push
