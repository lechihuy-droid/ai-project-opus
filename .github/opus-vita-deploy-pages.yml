# Template — được sync-dashboard.yml copy sang opus-vita/.github/workflows/deploy-pages.yml
# Deploy tĩnh trực tiếp từ root, KHÔNG qua bước Build with Jekyll.
name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Một deploy tại một thời điểm; không hủy deploy đang chạy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true          # tự bật Pages + chuyển source sang GitHub Actions
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'                 # upload thẳng root, không qua Jekyll
      - id: deployment
        uses: actions/deploy-pages@v4
