<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Health Dashboard</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #10B981; --primary-dark: #059669; --primary-light: #D1FAE5;
  --bg: #F3F4F6; --card: #fff; --text: #111827; --muted: #6B7280; --faint: #9CA3AF;
  --border: #E5E7EB;
  --blue: #3B82F6; --amber: #F59E0B; --purple: #8B5CF6; --red: #EF4444;
  --r: 14px; --nav: 68px;
}
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); }
#app { max-width: 430px; margin: 0 auto; min-height: 100vh; background: var(--bg); }

/* ── Setup Screen ── */
#setup {
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 32px 24px;
}
.setup-icon { font-size: 56px; margin-bottom: 16px; }
.setup-title { font-size: 22px; font-weight: 800; margin-bottom: 6px; text-align: center; }
.setup-sub { font-size: 14px; color: var(--muted); text-align: center; line-height: 1.6; margin-bottom: 28px; }
.setup-card { width: 100%; background: var(--card); border-radius: var(--r); padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; }
.field-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); margin-bottom: 8px; display: block; }
.field-input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; outline: none; transition: border-color .2s; }
.field-input:focus { border-color: var(--primary); }
.hint { font-size: 11px; color: var(--faint); margin-top: 6px; line-height: 1.5; }
.btn-main { width: 100%; padding: 15px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: 0 4px 12px rgba(16,185,129,.35); }
.btn-main:active { opacity: .9; }

/* ── Main Layout ── */
#main { display: none; }
.topbar { position: sticky; top: 0; z-index: 50; background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 16px 10px; box-shadow: 0 1px 8px rgba(0,0,0,.06); }
.topbar-row { display: flex; justify-content: space-between; align-items: center; }
.topbar h1 { font-size: 18px; font-weight: 800; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.sync-btn { font-size: 13px; padding: 6px 12px; background: var(--primary-light); color: var(--primary-dark); border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: inherit; }
.settings-btn { width: 32px; height: 32px; border: none; background: var(--bg); border-radius: 8px; cursor: pointer; font-size: 16px; }

/* Range tabs */
.range-tabs { display: flex; gap: 6px; margin-top: 10px; }
.tab { flex: 1; padding: 7px; text-align: center; font-size: 12px; font-weight: 600; border-radius: 8px; border: none; background: var(--bg); color: var(--muted); cursor: pointer; transition: all .2s; font-family: inherit; }
.tab.active { background: var(--primary); color: #fff; }

/* Content */
.content { padding: 14px 14px 90px; }

/* Cards */
.card { background: var(--card); border-radius: var(--r); padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.07); margin-bottom: 12px; }
.card-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--faint); margin-bottom: 10px; }

/* Summary row */
.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--card); border-radius: 12px; padding: 11px 8px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
.stat .v { font-size: 18px; font-weight: 900; line-height: 1.1; }
.stat .l { font-size: 9px; color: var(--muted); margin-top: 3px; font-weight: 600; }

/* Chart */
.chart-wrap { position: relative; height: 140px; }
canvas { display: block; }

/* Metrics grid */
.metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.metric-mini { background: var(--card); border-radius: 12px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
.metric-mini .icon { font-size: 18px; margin-bottom: 6px; }
.metric-mini .val { font-size: 17px; font-weight: 800; line-height: 1; }
.metric-mini .sub { font-size: 10px; color: var(--muted); margin-top: 3px; }
.pbar { height: 4px; background: var(--bg); border-radius: 2px; margin-top: 7px; overflow: hidden; }
.pfill { height: 100%; border-radius: 2px; transition: width .5s; }

/* Meals */
.meal-section { margin-bottom: 10px; }
.meal-time-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px; padding-left: 2px; }
.meal-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.meal-item:last-child { border-bottom: none; }
.meal-emoji { font-size: 18px; flex-shrink: 0; }
.meal-info { flex: 1; min-width: 0; }
.meal-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meal-macro { font-size: 10px; color: var(--muted); margin-top: 2px; }
.meal-kcal { font-size: 13px; font-weight: 800; color: var(--primary); flex-shrink: 0; }

/* Weight trend */
.weight-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.weight-now { font-size: 28px; font-weight: 900; }
.weight-delta { font-size: 13px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
.delta-down { background: #D1FAE5; color: #065F46; }
.delta-up { background: #FEE2E2; color: #991B1B; }
.delta-flat { background: var(--bg); color: var(--muted); }

/* Loading / error */
.loading { text-align: center; padding: 48px 20px; color: var(--muted); }
.loading .spin { font-size: 28px; display: block; margin-bottom: 10px; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-box { background: #FEF2F2; border-left: 3px solid var(--red); border-radius: 10px; padding: 14px; font-size: 13px; color: #991B1B; line-height: 1.6; }

/* Toast */
.toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-80px); background: #111827; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; z-index: 999; transition: transform .3s cubic-bezier(.34,1.56,.64,1); white-space: nowrap; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
.toast.show { transform: translateX(-50%) translateY(0); }

/* Bottom nav */
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; height: var(--nav); background: var(--card); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; padding: 0 8px 10px; z-index: 100; box-shadow: 0 -2px 16px rgba(0,0,0,.07); }
.nav-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 12px; background: none; border: none; cursor: pointer; color: var(--faint); flex: 1; font-family: inherit; border-radius: 10px; transition: color .2s; }
.nav-btn.active { color: var(--primary); }
.nav-btn svg { width: 20px; height: 20px; }
.nav-btn span { font-size: 9px; font-weight: 700; text-transform: uppercase; }

/* Screens */
.screen { display: none; }
.screen.active { display: block; }
</style>
</head>
<body>
<div id="app">

  <!-- ══ SETUP SCREEN ══ -->
  <div id="setup">
    <div class="setup-icon">🌿</div>
    <div class="setup-title">Health Dashboard</div>
    <div class="setup-sub">Nhập GitHub Personal Access Token để kết nối với dữ liệu sức khỏe của bạn.</div>

    <div class="setup-card">
      <label class="field-label">GitHub PAT</label>
      <input class="field-input" type="password" id="pat-input" placeholder="github_pat_...">
      <p class="hint">
        Tạo tại: GitHub → Settings → Developer settings → Fine-grained tokens<br>
        Scope cần: <strong>Contents = Read-only</strong> cho repo <code>ai-project-opus</code>
      </p>
    </div>

    <div class="setup-card">
      <label class="field-label">Repo</label>
      <input class="field-input" type="text" id="repo-input" value="lechihuy-droid/ai-project-opus">
      <div style="height:10px"></div>
      <label class="field-label">Branch</label>
      <input class="field-input" type="text" id="branch-input" value="main">
    </div>

    <button class="btn-main" onclick="saveSetup()">Kết nối →</button>
  </div>

  <!-- ══ MAIN DASHBOARD ══ -->
  <div id="main">
    <div class="topbar">
      <div class="topbar-row">
        <h1>🌿 Health</h1>
        <div class="topbar-right">
          <button class="sync-btn" onclick="reload()">↻ Sync</button>
          <button class="settings-btn" onclick="openSetup()" title="Cài đặt">⚙️</button>
        </div>
      </div>
      <div class="range-tabs">
        <button class="tab active" onclick="setRange(7,this)">7 ngày</button>
        <button class="tab" onclick="setRange(14,this)">14 ngày</button>
        <button class="tab" onclick="setRange(30,this)">30 ngày</button>
        <button class="tab" onclick="setRange(90,this)">3 tháng</button>
      </div>
    </div>

    <div class="content" id="content">
      <div class="loading"><span class="spin">🌿</span>Đang tải dữ liệu...</div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <button class="nav-btn active" id="nav-overview" onclick="showTab('overview')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Tổng quan</span>
      </button>
      <button class="nav-btn" id="nav-food" onclick="showTab('food')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8zM6 1v3M10 1v3M14 1v3"/></svg>
        <span>Bữa ăn</span>
      </button>
      <button class="nav-btn" id="nav-body" onclick="showTab('body')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 000-7.78z"/></svg>
        <span>Sức khỏe</span>
      </button>
    </nav>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════
//  CONFIG
// ═══════════════════════════════
let CFG = {
  pat: '',
  repo: 'lechihuy-droid/ai-project-opus',
  branch: 'main'
};
let currentRange = 7;
let currentTab = 'overview';
let cachedLogs = [];

// ═══════════════════════════════
//  SETUP
// ═══════════════════════════════
function loadConfig() {
  const s = localStorage.getItem('hm_cfg');
  if (s) { CFG = JSON.parse(s); return true; }
  return false;
}

function saveSetup() {
  const pat = document.getElementById('pat-input').value.trim();
  const repo = document.getElementById('repo-input').value.trim();
  const branch = document.getElementById('branch-input').value.trim();
  if (!pat) { toast('⚠️ Nhập GitHub PAT'); return; }
  CFG = { pat, repo, branch };
  localStorage.setItem('hm_cfg', JSON.stringify(CFG));
  startApp();
}

function openSetup() {
  document.getElementById('main').style.display = 'none';
  document.getElementById('setup').style.display = 'flex';
  document.getElementById('pat-input').value = CFG.pat;
  document.getElementById('repo-input').value = CFG.repo;
  document.getElementById('branch-input').value = CFG.branch;
}

// ═══════════════════════════════
//  GITHUB API
// ═══════════════════════════════
async function ghGet(path) {
  const url = `https://api.github.com/repos/${CFG.repo}/contents/${path}?ref=${CFG.branch}`;
  const r = await fetch(url, {
    headers: { 'Authorization': `Bearer ${CFG.pat}`, 'Accept': 'application/vnd.github.v3+json' }
  });
  if (!r.ok) {
    if (r.status === 404) return null;
    throw new Error(`GitHub API ${r.status}: ${path}`);
  }
  const data = await r.json();
  return JSON.parse(atob(data.content.replace(/\n/g, '')));
}

// ═══════════════════════════════
//  DATA LOADING
// ═══════════════════════════════
function datesInRange(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    out.push(d.toISOString().slice(0, 10));
  }
  return out;
}

async function loadLogs(range) {
  const index = await ghGet('health-data/index.json');
  if (!index) throw new Error('Không tìm thấy health-data/index.json');
  const needed = datesInRange(range);
  const available = needed.filter(d => index.includes(d));
  const logs = await Promise.all(available.map(d => ghGet(`health-data/${d}.json`)));
  return logs.filter(Boolean).sort((a, b) => b.date.localeCompare(a.date));
}

// ═══════════════════════════════
//  RENDER
// ═══════════════════════════════
function setRange(n, btn) {
  currentRange = n;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  reload();
}

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-' + tab).classList.add('active');
  renderContent(cachedLogs);
}

async function reload() {
  const el = document.getElementById('content');
  el.innerHTML = '<div class="loading"><span class="spin">🌿</span>Đang tải...</div>';
  try {
    cachedLogs = await loadLogs(currentRange);
    renderContent(cachedLogs);
  } catch (e) {
    el.innerHTML = `<div class="error-box">❌ Lỗi kết nối GitHub:<br><strong>${e.message}</strong><br><br>Kiểm tra PAT và kết nối mạng.</div>`;
  }
}

function renderContent(logs) {
  const el = document.getElementById('content');
  if (!logs.length) {
    el.innerHTML = '<div class="loading">😶 Không có dữ liệu trong khoảng này</div>';
    return;
  }
  if (currentTab === 'overview') el.innerHTML = renderOverview(logs);
  else if (currentTab === 'food')  el.innerHTML = renderFood(logs);
  else if (currentTab === 'body')  el.innerHTML = renderBody(logs);
  drawCharts(logs);
}

// ── Overview tab ──
function renderOverview(logs) {
  const avgCal = avg(logs, l => totalKcal(l));
  const avgSleep = avg(logs, l => l.sleep_hours || 0);
  const avgSteps = avg(logs, l => l.steps || 0);
  const latest = logs.find(l => l.weight_kg > 0);

  return `
    <div class="summary">
      <div class="stat">
        <div class="v" style="color:var(--red)">${Math.round(avgCal)}</div>
        <div class="l">avg kcal</div>
      </div>
      <div class="stat">
        <div class="v" style="color:var(--purple)">${avgSleep.toFixed(1)}</div>
        <div class="l">avg giờ ngủ</div>
      </div>
      <div class="stat">
        <div class="v" style="color:var(--amber)">${(avgSteps/1000).toFixed(1)}k</div>
        <div class="l">avg bước</div>
      </div>
      <div class="stat">
        <div class="v" style="color:var(--primary)">${latest ? latest.weight_kg : '--'}</div>
        <div class="l">kg hiện tại</div>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Calo mỗi ngày (kcal)</div>
      <div class="chart-wrap"><canvas id="c-cal"></canvas></div>
    </div>

    <div class="card">
      <div class="card-label">Macro trung bình (g/ngày)</div>
      <div class="chart-wrap"><canvas id="c-macro"></canvas></div>
    </div>

    <div class="metric-grid">
      <div class="metric-mini">
        <div class="icon">💧</div>
        <div class="val">${(avg(logs, l => l.water_ml || 0) / 1000).toFixed(1)}L</div>
        <div class="sub">trung bình / ngày</div>
        <div class="pbar"><div class="pfill" style="background:var(--blue);width:${Math.min(100,(avg(logs,l=>l.water_ml||0)/2000)*100)}%"></div></div>
      </div>
      <div class="metric-mini">
        <div class="icon">👟</div>
        <div class="val">${(avg(logs, l => l.steps || 0)/1000).toFixed(1)}k</div>
        <div class="sub">trung bình / ngày</div>
        <div class="pbar"><div class="pfill" style="background:var(--amber);width:${Math.min(100,(avg(logs,l=>l.steps||0)/8000)*100)}%"></div></div>
      </div>
      <div class="metric-mini">
        <div class="icon">😴</div>
        <div class="val">${avgSleep.toFixed(1)}h</div>
        <div class="sub">trung bình / đêm</div>
        <div class="pbar"><div class="pfill" style="background:var(--purple);width:${Math.min(100,(avgSleep/8)*100)}%"></div></div>
      </div>
      <div class="metric-mini">
        <div class="icon">🔥</div>
        <div class="val">${Math.round(avgCal)}</div>
        <div class="sub">avg kcal / ngày</div>
        <div class="pbar"><div class="pfill" style="background:var(--red);width:${Math.min(100,(avgCal/2000)*100)}%"></div></div>
      </div>
    </div>`;
}

// ── Food tab ──
function renderFood(logs) {
  const recent = logs.slice(0, 5);
  const avgP = avg(logs, l => totalMacro(l, 'protein'));
  const avgC = avg(logs, l => totalMacro(l, 'carb'));
  const avgF = avg(logs, l => totalMacro(l, 'fat'));

  const sections = recent.map(l => {
    const meals = (l.meals || []);
    const dayLabel = formatDate(l.date);
    const rows = meals.map(m => {
      const items = (m.items || []);
      const emoji = m.source === 'receipt' ? '🧾' : m.source === 'bill' ? '🛒' : '📸';
      return items.map(it => `
        <div class="meal-item">
          <div class="meal-emoji">${emoji}</div>
          <div class="meal-info">
            <div class="meal-name">${it.name}</div>
            <div class="meal-macro">${it.grams}g · P:${it.protein}g C:${it.carb}g F:${it.fat}g</div>
          </div>
          <div class="meal-kcal">${it.kcal}</div>
        </div>`).join('');
    }).join('');

    return `<div class="card">
      <div class="card-label">${dayLabel} · ${totalKcal(l)} kcal tổng</div>
      ${rows || '<div style="color:var(--faint);font-size:13px;padding:8px 0">Không có dữ liệu</div>'}
    </div>`;
  }).join('');

  return `
    <div class="card">
      <div class="card-label">Macro trung bình / ngày</div>
      <div style="display:flex;gap:10px;text-align:center">
        <div style="flex:1"><div style="font-size:22px;font-weight:900;color:var(--blue)">${Math.round(avgP)}g</div><div style="font-size:11px;color:var(--muted)">Protein</div></div>
        <div style="flex:1"><div style="font-size:22px;font-weight:900;color:var(--amber)">${Math.round(avgC)}g</div><div style="font-size:11px;color:var(--muted)">Carb</div></div>
        <div style="flex:1"><div style="font-size:22px;font-weight:900;color:var(--purple)">${Math.round(avgF)}g</div><div style="font-size:11px;color:var(--muted)">Fat</div></div>
      </div>
    </div>
    ${sections}`;
}

// ── Body tab ──
function renderBody(logs) {
  const withWeight = logs.filter(l => l.weight_kg > 0);
  const first = withWeight[withWeight.length - 1];
  const last = withWeight[0];
  const delta = first && last ? (last.weight_kg - first.weight_kg).toFixed(1) : null;
  const deltaClass = delta > 0 ? 'delta-up' : delta < 0 ? 'delta-down' : 'delta-flat';
  const deltaStr = delta > 0 ? `+${delta} kg` : `${delta} kg`;

  return `
    <div class="card">
      <div class="card-label">Cân nặng</div>
      <div class="weight-row">
        <div class="weight-now">${last ? last.weight_kg + ' kg' : '--'}</div>
        ${delta !== null ? `<div class="weight-delta ${deltaClass}">${deltaStr}</div>` : ''}
      </div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px">so với ${currentRange} ngày trước</div>
      <div class="chart-wrap"><canvas id="c-weight"></canvas></div>
    </div>

    <div class="card">
      <div class="card-label">Giấc ngủ (giờ/đêm)</div>
      <div class="chart-wrap"><canvas id="c-sleep"></canvas></div>
    </div>

    <div class="card">
      <div class="card-label">Bước chân / ngày</div>
      <div class="chart-wrap"><canvas id="c-steps"></canvas></div>
    </div>

    <div class="card">
      <div class="card-label">Nước uống / ngày</div>
      <div class="chart-wrap"><canvas id="c-water"></canvas></div>
    </div>`;
}

// ═══════════════════════════════
//  CHARTS
// ═══════════════════════════════
function drawCharts(logs) {
  const ordered = [...logs].reverse();
  const labels = ordered.map(l => shortDate(l.date));
  setTimeout(() => {
    if (currentTab === 'overview') {
      drawBar('c-cal',   labels, ordered.map(l => totalKcal(l)),       '#EF4444', 2000);
      drawHBar('c-macro', ['Protein','Carb','Fat'],
        [avg(logs,l=>totalMacro(l,'protein')), avg(logs,l=>totalMacro(l,'carb')), avg(logs,l=>totalMacro(l,'fat'))],
        ['#3B82F6','#F59E0B','#8B5CF6']);
    } else if (currentTab === 'body') {
      drawLine('c-weight', labels, ordered.map(l => l.weight_kg || 0), '#10B981');
      drawLine('c-sleep',  labels, ordered.map(l => l.sleep_hours || 0), '#8B5CF6', 7.5);
      drawBar('c-steps',   labels, ordered.map(l => (l.steps || 0)/1000), '#F59E0B', 8);
      drawBar('c-water',   labels, ordered.map(l => (l.water_ml||0)/1000), '#3B82F6', 2);
    }
  }, 30);
}

function setupCanvas(id, h=140) {
  const c = document.getElementById(id);
  if (!c) return null;
  const dpr = window.devicePixelRatio || 1;
  const W = c.parentElement.offsetWidth || 300;
  c.style.width = W + 'px'; c.style.height = h + 'px';
  c.width = W * dpr; c.height = h * dpr;
  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr);
  return { ctx, W, H: h, dpr };
}

function noData(ctx, W, H) {
  ctx.fillStyle = '#9CA3AF'; ctx.font = '12px -apple-system';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Chưa có dữ liệu', W/2, H/2);
}

function drawBar(id, labels, data, color, goalVal=null) {
  const s = setupCanvas(id); if (!s) return;
  const { ctx, W, H } = s;
  ctx.clearRect(0, 0, W, H);
  if (data.every(v => !v)) { noData(ctx, W, H); return; }

  const pad = { t: 22, r: 10, b: 26, l: 32 };
  const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
  const max = Math.max(...data, goalVal||0) * 1.2 || 1;

  // Goal line
  if (goalVal) {
    const gy = pad.t + ch - (goalVal/max)*ch;
    ctx.setLineDash([4,3]); ctx.strokeStyle = color + '66'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(pad.l, gy); ctx.lineTo(W-pad.r, gy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = color + '99'; ctx.font = '9px -apple-system'; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    ctx.fillText('目標', W-pad.r-2, gy-2);
  }

  // Grid
  [0,.5,1].forEach(t => {
    const y = pad.t + ch*t;
    ctx.strokeStyle = '#F3F4F6'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W-pad.r, y); ctx.stroke();
    ctx.fillStyle = '#9CA3AF'; ctx.font = '9px -apple-system'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText((max*(1-t)).toFixed(max>10?0:1), pad.l-3, y);
  });

  const n = labels.length;
  const slotW = cw / Math.max(n,1);
  const barW = Math.min(slotW * 0.6, 28);

  data.forEach((v, i) => {
    const x = pad.l + slotW*i + (slotW-barW)/2;
    const bh = (v/max)*ch;
    const y = pad.t + ch - bh;
    const isToday = i === n-1;
    ctx.fillStyle = isToday ? color : color + '77';
    if (bh > 0) {
      ctx.beginPath();
      const r = 4;
      ctx.moveTo(x+r,y); ctx.lineTo(x+barW-r,y);
      ctx.quadraticCurveTo(x+barW,y,x+barW,y+r);
      ctx.lineTo(x+barW,pad.t+ch); ctx.lineTo(x,pad.t+ch); ctx.lineTo(x,y+r);
      ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath(); ctx.fill();
    }
    if (v > 0) {
      ctx.fillStyle = '#374151'; ctx.font = `${isToday?'bold ':''} 9px -apple-system`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText(v%1===0?v:v.toFixed(1), x+barW/2, y-2);
    }
    ctx.fillStyle = isToday ? '#111827' : '#9CA3AF';
    ctx.font = `${isToday?'bold ':''} 9px -apple-system`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(labels[i], x+barW/2, H-2);
  });
}

function drawLine(id, labels, data, color, goalVal=null) {
  const s = setupCanvas(id); if (!s) return;
  const { ctx, W, H } = s;
  ctx.clearRect(0, 0, W, H);
  const nonZero = data.filter(v => v > 0);
  if (!nonZero.length) { noData(ctx, W, H); return; }

  const pad = { t: 22, r: 10, b: 26, l: 34 };
  const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
  const max = Math.max(...nonZero, goalVal||0) * 1.15;
  const min = Math.min(...nonZero) * 0.85;
  const range = max - min || 1;

  // Goal
  if (goalVal) {
    const gy = pad.t + ch - ((goalVal-min)/range)*ch;
    ctx.setLineDash([4,3]); ctx.strokeStyle = color + '55'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(pad.l,gy); ctx.lineTo(W-pad.r,gy); ctx.stroke();
    ctx.setLineDash([]);
  }

  [0,.5,1].forEach(t => {
    const y = pad.t + ch*t;
    ctx.strokeStyle = '#F3F4F6'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
    const v = max - range*t;
    ctx.fillStyle = '#9CA3AF'; ctx.font = '9px -apple-system'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(v.toFixed(1), pad.l-3, y);
  });

  const n = labels.length;
  const pts = data.map((v,i) => ({
    x: pad.l + (n>1?(i/(n-1))*cw : cw/2),
    y: v > 0 ? pad.t + ch - ((v-min)/range)*ch : null
  }));

  // Area
  const grad = ctx.createLinearGradient(0,pad.t,0,pad.t+ch);
  grad.addColorStop(0, color+'30'); grad.addColorStop(1, color+'00');
  ctx.beginPath();
  let started = false;
  pts.forEach((p,i) => {
    if (!p.y) return;
    if (!started) { ctx.moveTo(p.x, pad.t+ch); ctx.lineTo(p.x,p.y); started=true; }
    else ctx.lineTo(p.x,p.y);
  });
  const lastPt = [...pts].reverse().find(p=>p.y);
  if (lastPt) ctx.lineTo(lastPt.x, pad.t+ch);
  ctx.closePath(); ctx.fillStyle = grad; ctx.fill();

  // Line
  ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
  let lStarted = false;
  pts.forEach(p => {
    if (!p.y) { lStarted = false; return; }
    if (!lStarted) { ctx.moveTo(p.x,p.y); lStarted=true; }
    else ctx.lineTo(p.x,p.y);
  });
  ctx.stroke();

  // Dots
  pts.forEach((p,i) => {
    if (!p.y) return;
    ctx.beginPath(); ctx.arc(p.x,p.y,3.5,0,Math.PI*2);
    ctx.fillStyle='white'; ctx.strokeStyle=color; ctx.lineWidth=2; ctx.fill(); ctx.stroke();
    ctx.fillStyle='#374151'; ctx.font='9px -apple-system'; ctx.textAlign='center'; ctx.textBaseline='bottom';
    if (data[i]) ctx.fillText(data[i]%1===0?data[i]:data[i].toFixed(1), p.x, p.y-5);
  });

  labels.forEach((l,i) => {
    const x = pad.l + (n>1?(i/(n-1))*cw:cw/2);
    ctx.fillStyle = i===n-1?'#111827':'#9CA3AF';
    ctx.font = `${i===n-1?'bold ':''} 9px -apple-system`;
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText(l,x,H-2);
  });
}

function drawHBar(id, labels, data, colors) {
  const s = setupCanvas(id); if (!s) return;
  const { ctx, W, H } = s;
  ctx.clearRect(0,0,W,H);
  const max = Math.max(...data) * 1.3 || 1;
  const pad = { t:14, r:10, b:14, l:52 };
  const cw = W-pad.l-pad.r, ch = H-pad.t-pad.b;
  const rowH = ch / labels.length;

  labels.forEach((lbl,i) => {
    const y = pad.t + rowH*i + rowH*.15;
    const bh = rowH*.55;
    const pct = Math.min(1, data[i]/max);
    ctx.fillStyle = '#F3F4F6'; ctx.beginPath();
    ctx.roundRect(pad.l,y,cw,bh,bh/2); ctx.fill();
    if (pct > 0) {
      ctx.fillStyle = colors[i]; ctx.beginPath();
      ctx.roundRect(pad.l,y,cw*pct,bh,bh/2); ctx.fill();
    }
    ctx.fillStyle='#374151'; ctx.font='10px -apple-system'; ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText(lbl, pad.l-6, y+bh/2);
    ctx.fillStyle=colors[i]; ctx.font='bold 10px -apple-system'; ctx.textAlign='left';
    ctx.fillText(Math.round(data[i])+'g', pad.l+cw*pct+5, y+bh/2);
  });
}

// ═══════════════════════════════
//  HELPERS
// ═══════════════════════════════
function totalKcal(log) {
  return (log.meals||[]).reduce((s,m) => s + (m.total_kcal||0), 0);
}
function totalMacro(log, key) {
  return (log.meals||[]).reduce((s,m) => s + (m['total_'+key]||0), 0);
}
function avg(arr, fn) {
  const vals = arr.map(fn).filter(v => v > 0);
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
}
function shortDate(str) {
  const d = new Date(str+'T12:00:00');
  const days = ['CN','T2','T3','T4','T5','T6','T7'];
  return days[d.getDay()];
}
function formatDate(str) {
  const d = new Date(str+'T12:00:00');
  const days = ['CN','T2','T3','T4','T5','T6','T7'];
  return `${days[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`;
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

function startApp() {
  document.getElementById('setup').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  reload();
}

if (loadConfig() && CFG.pat) {
  startApp();
}
