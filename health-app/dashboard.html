<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#090A0F">
<title>Opus Nexus</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#090A0F;font-family:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Text",sans-serif}.core{position:fixed;inset:0;width:100%;height:100%;border:0;background:#090A0F}.fallback{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:#090A0F;color:#F7F8FA;z-index:2}.fallback-card{max-width:340px;background:#151720;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:18px}.fallback h2{font-size:18px;margin-bottom:8px}.fallback p{font-size:13px;line-height:1.55;color:#9BA1AE;margin-bottom:12px}.fallback a{display:inline-block;border-radius:10px;background:#0A84FF;color:#fff;text-decoration:none;padding:11px 14px;font-size:13px;font-weight:800}.sugar-pill{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));right:14px;z-index:9999;min-width:86px;padding:8px 10px;border-radius:14px;background:rgba(21,23,32,.94);border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 24px rgba(0,0,0,.35);color:#F7F8FA;text-decoration:none;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}.sugar-label{font-size:9px;line-height:1;font-weight:800;letter-spacing:.55px;text-transform:uppercase;color:#9BA1AE;margin-bottom:4px}.sugar-row{display:flex;align-items:baseline;gap:2px}.sugar-val{font-size:20px;line-height:1;font-weight:800;color:#FF453A;letter-spacing:-.4px}.sugar-unit{font-size:10px;font-weight:800;color:#9BA1AE}.sugar-sub{font-size:9px;color:#FF9F0A;font-weight:700;margin-top:3px;white-space:nowrap}.sugar-bar{height:4px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}.sugar-fill{height:100%;width:0%;border-radius:3px;background:linear-gradient(90deg,#FF9F0A,#FF453A)}.sugar-pill.good .sugar-val{color:#30D158}.sugar-pill.good .sugar-sub{color:#30D158}.sugar-pill.good .sugar-fill{background:#30D158}.sugar-pill.bad .sugar-val{color:#FF453A}.sugar-pill.bad .sugar-sub{color:#FF453A}@media(max-width:360px){.sugar-pill{top:calc(66px + env(safe-area-inset-top,0px));right:10px;min-width:78px;padding:7px 9px}.sugar-val{font-size:18px}}
</style>
</head>
<body>
<iframe class="core" id="core-frame" title="Opus Nexus"></iframe>
<div class="fallback" id="fallback"><div class="fallback-card"><h2>Không load được app core</h2><p>Đường đã hiện, nhưng app chính chưa tìm thấy file core theo path hiện tại. Bấm nút dưới để mở trực tiếp.</p><a id="fallback-link" href="#">Mở app core</a></div></div>
<a class="sugar-pill" id="sugar-pill" href="sugar.html" aria-label="Xem chi tiết lượng đường">
  <div class="sugar-label">Đường</div>
  <div class="sugar-row"><span class="sugar-val" id="sugar-val">—</span><span class="sugar-unit">g</span></div>
  <div class="sugar-sub" id="sugar-sub">đang tải</div>
  <div class="sugar-bar"><div class="sugar-fill" id="sugar-fill"></div></div>
</a>
<script>
const DATA_REPO='lechihuy-droid/ai-project-opus';
const DATA_BRANCH='main';
const TARGET_TOTAL=50;
let PAT=localStorage.getItem('ov_pat')||'';
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function candidateBasePaths(){const p=location.pathname;const dir=p.endsWith('/')?p:p.slice(0,p.lastIndexOf('/')+1);const paths=[dir, '/ai-project-opus/health-app/', '/health-app/', '/'];return [...new Set(paths)]}
async function exists(path){try{const r=await fetch(path,{method:'HEAD',cache:'no-store'});return r.ok}catch(e){return false}}
async function bootCore(){const frame=document.getElementById('core-frame');const fallback=document.getElementById('fallback');const link=document.getElementById('fallback-link');for(const base of candidateBasePaths()){const core=base+'dashboard-core.html';if(await exists(core)){frame.src=core;link.href=core;return}}const final='/ai-project-opus/health-app/dashboard-core.html';frame.src=final;link.href=final;setTimeout(()=>{fallback.style.display='flex'},1200)}
async function ghGet(path){const r=await fetch(`https://api.github.com/repos/${DATA_REPO}/contents/${path}?ref=${DATA_BRANCH}`,{headers:{Authorization:`Bearer ${PAT}`,Accept:'application/vnd.github.v3+json'}});if(!r.ok){if(r.status===404)return null;throw new Error(`${r.status}: ${path}`)}const d=await r.json();const bytes=Uint8Array.from(atob(d.content.replace(/\n/g,'')),c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}
function totalSugar(log){const meals=log?.meals||[];return Number(log?.daily_totals?.sugar_g ?? log?.sugar_tracking?.current_total_sugar_g ?? meals.reduce((s,m)=>s+Number(m.total_sugar||0),0))}
async function loadSugar(){const pill=document.getElementById('sugar-pill'), val=document.getElementById('sugar-val'), sub=document.getElementById('sugar-sub'), fill=document.getElementById('sugar-fill');try{if(!PAT){sub.textContent='cần PAT';return}const log=await ghGet(`health-data/${todayStr()}.json`);const sugar=log?totalSugar(log):0;const pct=Math.max(0,Math.min(100,sugar/TARGET_TOTAL*100));const remain=Math.round((TARGET_TOTAL-sugar)*10)/10;val.textContent=Number.isInteger(sugar)?sugar.toFixed(0):sugar.toFixed(1);fill.style.width=pct+'%';pill.classList.toggle('good',sugar>0&&sugar<=25);pill.classList.toggle('bad',sugar>50);sub.textContent=sugar>0?(remain>=0?`còn ${remain}g`:`vượt ${Math.abs(remain)}g`):'chưa log'}catch(e){sub.textContent='lỗi sync'}}
bootCore();loadSugar();window.addEventListener('focus',loadSugar);
</script>
</body>
</html>
