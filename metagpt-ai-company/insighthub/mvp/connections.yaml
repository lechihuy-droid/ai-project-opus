# InsightHub — external system connections.
#
# Each entry declares an "assumed" linked system. In MVP the adapter is `file`
# (reads the supplied sample export). Switching to a live API later only means
# changing `adapter: api` and providing the real credential — the MCP tool
# surface and the downstream pipeline do not change.
#
# `auth` references an environment variable name only. No secret is stored here.

project: "Project Sakura"
period:
  start: "2026-05-15"
  end: "2026-05-21"

base_urls:
  jira: "https://example.atlassian.net/browse"
  github: "https://github.com/fpt-japan/project-sakura"

systems:
  jira:
    adapter: file            # file | api
    auth: env:JIRA_TOKEN
    file: data/sample/Sample_Jira_Export.xlsx
    api_base: "https://example.atlassian.net"   # used only when adapter=api

  chat:
    adapter: file
    auth: env:SLACK_TOKEN
    provider: slack          # slack | teams
    file: data/sample/Sample_Slack_Messages.json
    api_base: "https://slack.com/api"

  github:
    adapter: file
    auth: env:GITHUB_TOKEN
    file: data/sample/Sample_GitHub_Activity.json
    api_base: "https://api.github.com"

# Sources that are file uploads by nature (no external API).
uploads:
  wbs: data/sample/Sample_WBS.xlsx
  minutes_dir: data/sample/minutes
