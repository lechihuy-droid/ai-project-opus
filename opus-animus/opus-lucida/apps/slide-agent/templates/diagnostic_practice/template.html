<div class="layout diagnostic-practice">
  <p class="slide-kicker">{{phase_label}}</p>
  <h2 data-slot="title">{{title}}</h2>
  <div class="diagnostic-grid">
    <section class="board-panel board-before"><div class="board-label">Trước khi chốt</div><div class="jp-question" data-slot="question">{{question}}</div><div class="choice-list" data-slot="choices">{{#choices}}<div class="choice-pill">{{.}}</div>{{/choices}}</div></section>
    <section class="feedback-panel board-after"><div class="board-label">Sau khi chốt</div><div class="answer-strip" data-slot="answer">{{answer}}</div><ul data-slot="feedback">{{#feedback}}<li>{{.}}</li>{{/feedback}}</ul></section>
  </div>
</div>
