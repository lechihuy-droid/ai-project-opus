<div class="layout quiz-before-after">
  <p class="slide-kicker">{{phase_label}}</p>
  <h2 data-slot="title">{{title}}</h2>
  <div class="quiz-board">
    <section class="board-panel board-before">
      <div class="board-label">Trước khi chốt</div>
      <div class="jp-question" data-slot="question">{{question}}</div>
      <div class="choice-list" data-slot="choices">{{#choices}}<div class="choice-pill">{{.}}</div>{{/choices}}</div>
    </section>
    <section class="board-panel board-after">
      <div class="board-label">Sau khi chốt</div>
      <div class="answer-strip" data-slot="answer">{{answer}}</div>
      <div class="support compact" data-slot="payoff">{{payoff}}</div>
    </section>
  </div>
</div>
