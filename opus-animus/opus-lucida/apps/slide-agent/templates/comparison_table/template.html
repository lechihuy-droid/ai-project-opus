<div class="layout comparison-table">
  <p class="slide-kicker">{{phase_label}}</p>
  <h2 data-slot="title">{{title}}</h2>
  <div class="comparison-grid" data-slot="rows">
    {{#rows}}<div class="comparison-row"><strong>{{label}}</strong><span>{{value}}</span><em>{{note}}</em></div>{{/rows}}
  </div>
</div>
