<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sample</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
:root {
  --lucida-ink: #111827;
  --lucida-charcoal: #1f2937;
  --lucida-paper: #f7f1e5;
  --lucida-mist: #e7e2d6;
  --lucida-line: rgba(247, 241, 229, 0.18);
  --lucida-amber: #f5b841;
  --lucida-blue: #4a90e2;
  --lucida-red: #d95d59;
  --lucida-green: #2f7d5c;
  --lucida-violet: #7c6a9e;
  --font-ui: "Manrope", "Segoe UI", Arial, sans-serif;
  --font-jp: "Noto Sans JP", "BIZ UDPGothic", Meiryo, sans-serif;
}

html,
body,
#root {
  width: 100%;
  min-height: 100%;
  margin: 0;
}

body {
  background: #05070b;
  color: var(--lucida-paper);
  font-family: var(--font-ui);
}

* {
  box-sizing: border-box;
}


.deck {
  width: 1920px;
  margin: 0 auto;
  background: #05070b;
}

.slide {
  position: relative;
  width: 1920px;
  height: 1080px;
  display: grid;
  grid-template-rows: 84px 1fr 62px;
  padding: 46px 72px 36px;
  overflow: hidden;
  page-break-after: always;
  background:
    linear-gradient(115deg, rgba(247, 241, 229, 0.065) 0 1px, transparent 1px 100%),
    linear-gradient(180deg, rgba(247, 241, 229, 0.045), transparent 36%),
    linear-gradient(180deg, var(--lucida-ink), #070a11);
  background-size: 78px 78px, auto, auto;
}

.slide::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(247, 241, 229, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(247, 241, 229, 0.03) 1px, transparent 1px);
  background-size: 72px 72px;
  mask-image: radial-gradient(ellipse at center, black 0%, transparent 82%);
  pointer-events: none;
}

.slide-topbar,
.slide-body,
.slide-footer {
  position: relative;
  z-index: 1;
}

.slide-topbar,
.slide-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: rgba(247, 241, 229, 0.64);
  font-size: 18px;
}

.slide-topbar {
  border-bottom: 1px solid var(--lucida-line);
  padding-bottom: 18px;
}

.slide-footer {
  border-top: 1px solid rgba(247, 241, 229, 0.1);
  padding-top: 14px;
}

.slide-number {
  margin-right: 16px;
  color: var(--accent);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.slide-template,
.slide-operation {
  text-transform: uppercase;
  letter-spacing: 0;
  font-weight: 700;
  font-size: 13px;
}

.slide-body {
  display: grid;
  align-items: center;
  justify-items: center;
}

.layout {
  width: min(1480px, 100%);
}

.accent-amber { --accent: var(--lucida-amber); }
.accent-blue { --accent: var(--lucida-blue); }
.accent-red { --accent: var(--lucida-red); }
.accent-green { --accent: var(--lucida-green); }
.accent-violet { --accent: var(--lucida-violet); }

.slide-kicker {
  margin: 0 0 22px;
  color: var(--accent);
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 0;
  text-transform: uppercase;
}

h1,
h2,
h3,
p {
  margin: 0;
}

h1 {
  max-width: 1180px;
  color: var(--lucida-paper);
  font-size: 96px;
  line-height: 0.98;
  letter-spacing: 0;
}

h2 {
  color: var(--lucida-paper);
  font-size: 66px;
  line-height: 1.04;
  letter-spacing: 0;
}

h3 {
  color: var(--lucida-paper);
  font-size: 34px;
  line-height: 1.1;
}

.hero-subtitle,
.support {
  margin-top: 28px;
  color: rgba(247, 241, 229, 0.72);
  font-size: 34px;
  line-height: 1.34;
  max-width: 1120px;
}

.takeaway-strip {
  margin-top: 44px;
  padding: 24px 30px;
  border-left: 8px solid var(--accent);
  background: rgba(247, 241, 229, 0.075);
  color: var(--lucida-paper);
  font-size: 32px;
  line-height: 1.25;
}

.message-box {
  margin-top: 34px;
  padding: 30px 34px;
  border: 1px solid rgba(247, 241, 229, 0.16);
  background: rgba(247, 241, 229, 0.075);
  color: var(--lucida-paper);
  font-size: 42px;
  line-height: 1.22;
}

.bullet-list {
  margin: 28px 0 0;
  padding-left: 34px;
  display: grid;
  gap: 14px;
  color: rgba(247, 241, 229, 0.78);
  font-size: 28px;
  line-height: 1.28;
}

.columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
  margin-top: 40px;
}

.panel {
  min-height: 360px;
  padding: 34px;
  border: 1px solid rgba(247, 241, 229, 0.16);
  background: rgba(247, 241, 229, 0.065);
}

.panel ul {
  margin: 24px 0 0;
  padding-left: 28px;
  display: grid;
  gap: 14px;
  color: rgba(247, 241, 229, 0.76);
  font-size: 27px;
  line-height: 1.3;
}

.comparison-grid {
  margin-top: 34px;
  display: grid;
  gap: 14px;
}

.comparison-row {
  display: grid;
  grid-template-columns: 270px 1fr 340px;
  gap: 18px;
  align-items: center;
  padding: 20px 24px;
  border: 1px solid rgba(247, 241, 229, 0.14);
  background: rgba(247, 241, 229, 0.065);
  color: rgba(247, 241, 229, 0.76);
  font-size: 25px;
  line-height: 1.22;
}

.comparison-row strong {
  color: var(--lucida-paper);
  font-family: var(--font-jp);
  font-size: 31px;
}

.comparison-row em {
  color: rgba(247, 241, 229, 0.58);
  font-style: normal;
}

.figure-focus {
  display: grid;
  grid-template-columns: 0.95fr 1.05fr;
  gap: 42px;
  align-items: center;
}

.figure-box {
  display: grid;
  min-height: 520px;
  place-items: center;
  border: 1px solid rgba(247, 241, 229, 0.18);
  background: rgba(247, 241, 229, 0.075);
  color: var(--accent);
  font-family: var(--font-jp);
  font-size: 56px;
  font-weight: 800;
  text-align: center;
}

.summary-grid {
  margin-top: 34px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.summary-item {
  min-height: 150px;
  padding: 26px;
  display: grid;
  align-items: center;
  border: 1px solid rgba(247, 241, 229, 0.14);
  background: rgba(247, 241, 229, 0.065);
  color: rgba(247, 241, 229, 0.8);
  font-size: 26px;
  line-height: 1.26;
}

.jp-question {
  margin-top: 28px;
  padding: 28px 32px;
  border: 1px solid rgba(247, 241, 229, 0.16);
  background: rgba(247, 241, 229, 0.065);
  color: var(--lucida-paper);
  font-family: var(--font-jp);
  font-size: 42px;
  line-height: 1.35;
  white-space: pre-line;
}

.jp-question.smaller {
  font-size: 34px;
}

.choice-list {
  margin-top: 24px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.choice-pill {
  min-height: 82px;
  padding: 18px 22px;
  display: grid;
  align-items: center;
  border: 1px solid rgba(247, 241, 229, 0.16);
  background: rgba(247, 241, 229, 0.07);
  color: rgba(247, 241, 229, 0.82);
  font-size: 25px;
  line-height: 1.22;
}

.answer-strip,
.example-strip,
.bonus-note {
  margin-top: 24px;
  padding: 20px 26px;
  border-left: 8px solid var(--accent);
  background: rgba(247, 241, 229, 0.085);
  color: var(--lucida-paper);
  font-size: 30px;
  line-height: 1.24;
}

.example-strip {
  display: flex;
  align-items: center;
  gap: 18px;
  font-family: var(--font-jp);
}

.example-strip span {
  color: var(--accent);
  font-family: var(--font-ui);
  font-size: 18px;
  font-weight: 800;
  text-transform: uppercase;
}

.support.compact {
  margin-top: 20px;
  font-size: 27px;
}

.grammar-shell {
  display: grid;
  grid-template-columns: 0.86fr 1.14fr;
  gap: 26px;
  align-items: stretch;
}

.pattern-card,
.grammar-cell,
.pair-grid section,
.checklist,
.mapping-row,
.feedback-panel,
.cta-item,
.board-panel {
  border: 1px solid rgba(247, 241, 229, 0.15);
  background: rgba(247, 241, 229, 0.065);
}

.pattern-card {
  min-height: 440px;
  padding: 34px;
  display: grid;
  align-content: center;
  gap: 20px;
  border-left: 8px solid var(--accent);
}

.pattern-card h2 {
  font-family: var(--font-jp);
  color: var(--accent);
  font-size: 70px;
  line-height: 1.02;
}

.pattern-card strong {
  color: var(--lucida-paper);
  font-size: 24px;
  line-height: 1.25;
}

.pattern-card p {
  color: rgba(247, 241, 229, 0.8);
  font-size: 31px;
  line-height: 1.28;
}

.grammar-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.grammar-cell {
  min-height: 198px;
  padding: 24px;
  display: grid;
  align-content: start;
  gap: 14px;
}

.grammar-cell strong {
  color: var(--accent);
  font-size: 22px;
}

.grammar-cell span {
  color: rgba(247, 241, 229, 0.82);
  font-size: 28px;
  line-height: 1.24;
}

.bonus-note {
  margin-top: 14px;
  border-left-color: rgba(247, 241, 229, 0.38);
  color: rgba(247, 241, 229, 0.76);
  font-size: 24px;
}

.pair-grid,
.diagnostic-grid,
.worked-grid,
.clue-layout,
.quiz-board {
  margin-top: 30px;
  display: grid;
  gap: 24px;
}

.pair-grid,
.diagnostic-grid,
.worked-grid,
.quiz-board {
  grid-template-columns: 1fr 1fr;
}

.worked-example h2 {
  font-size: 58px;
}

.worked-example .worked-grid {
  margin-top: 20px;
}

.worked-example .board-panel {
  padding: 22px 28px;
}

.worked-example .jp-question.smaller {
  font-size: 32px;
  line-height: 1.26;
  padding: 24px 28px;
}

.worked-example .choice-list {
  margin-top: 16px;
  gap: 12px;
}

.worked-example .choice-pill {
  min-height: 66px;
  padding: 14px 20px;
}

.worked-example .answer-strip {
  margin-top: 12px;
  padding: 16px 22px;
  font-size: 28px;
}

.worked-example .takeaway-strip {
  margin-top: 18px;
  padding: 18px 26px;
  font-size: 28px;
}

.board-panel {
  padding: 28px;
}

.board-label {
  margin-bottom: 16px;
  color: var(--accent);
  font-size: 18px;
  font-weight: 900;
  line-height: 1.1;
  text-transform: uppercase;
}

.board-before {
  border-top: 5px solid rgba(247, 241, 229, 0.34);
}

.board-after {
  border-top: 5px solid var(--accent);
}

.quiz-board .jp-question,
.diagnostic-grid .jp-question,
.worked-grid .jp-question {
  margin-top: 0;
}

.quiz-board .choice-list,
.worked-grid .choice-list,
.diagnostic-grid .choice-list {
  grid-template-columns: 1fr;
}

.quiz-board .answer-strip,
.worked-grid .answer-strip,
.diagnostic-grid .answer-strip {
  margin-top: 0;
}

.pair-grid section {
  min-height: 370px;
  padding: 30px;
}

.contrast-axis {
  margin-top: 24px;
  padding: 18px 24px;
  border-left: 6px solid var(--accent);
  background: rgba(247, 241, 229, 0.075);
  color: var(--lucida-paper);
  font-size: 26px;
  line-height: 1.2;
}

.pair-grid h3 {
  color: var(--accent);
}

.pair-grid ul,
.feedback-panel ul,
.step-list {
  margin: 22px 0 0;
  padding-left: 28px;
  display: grid;
  gap: 13px;
  color: rgba(247, 241, 229, 0.78);
  font-size: 25px;
  line-height: 1.25;
}

.jp-mini {
  margin-top: 26px;
  color: var(--lucida-paper);
  font-family: var(--font-jp);
  font-size: 34px;
}

.clue-layout {
  grid-template-columns: 0.75fr 1.25fr;
}

.checklist {
  padding: 24px;
  display: grid;
  gap: 14px;
  color: rgba(247, 241, 229, 0.82);
  font-size: 27px;
  line-height: 1.24;
}

.mapping-list {
  display: grid;
  gap: 12px;
}

.mapping-list > .board-label {
  margin-bottom: 2px;
}

.mapping-row {
  padding: 18px 22px;
  display: grid;
  grid-template-columns: 300px 1fr 210px;
  gap: 14px;
  align-items: center;
  color: rgba(247, 241, 229, 0.78);
  font-size: 23px;
  line-height: 1.2;
}

.mapping-row strong {
  color: var(--lucida-paper);
  font-size: 25px;
}

.mapping-row em {
  color: rgba(247, 241, 229, 0.58);
  font-style: normal;
}

.step-list {
  margin-top: 0;
  padding: 0 0 0 30px;
  border: 0;
  background: transparent;
  font-size: 24px;
}

.feedback-panel {
  padding: 30px;
}

.feedback-panel .answer-strip {
  margin-top: 0;
}

.cta-list {
  margin-top: 38px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
}

.cta-item {
  min-height: 132px;
  padding: 26px;
  display: grid;
  align-items: center;
  color: rgba(247, 241, 229, 0.82);
  font-size: 28px;
  line-height: 1.24;
}

  </style>
</head>
<body>
  <div class="deck" data-lane-id="sample">
<section class="slide accent-amber" data-slide-id="sample-01" data-template-id="hero_title" data-duration="8">
  <header class="slide-topbar">
    <div><span class="slide-number">01</span><span class="slide-template">Mở bài</span></div>
    <div class="slide-operation"></div>
  </header>
  <main class="slide-body">
<div class="layout hero-title">
  <p class="slide-kicker">Tình huống mở đầu</p>
  <h1 data-slot="title">Cùng có わけ, nhưng không cùng ý</h1>
  <p class="hero-subtitle" data-slot="subtitle">Một câu đang đính chính. Một câu đang nói có ràng buộc.</p>
  <div class="takeaway-strip" data-slot="footer_cue">Ở câu này, người nói đang muốn nói gì?</div>
</div>

  </main>
  <footer class="slide-footer">
    <span>Lucida</span>
    <span>Tình huống mở đầu</span>
    <span>01 / 01</span>
  </footer>
</section>
  </div>
</body>
</html>
