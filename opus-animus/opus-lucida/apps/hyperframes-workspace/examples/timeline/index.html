<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timeline</title>
    <style>
      html, body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #0b0f14;
        font-family: Inter, Segoe UI, Arial, sans-serif;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        color: #eef3fb;
      }
      .header {
        position: absolute;
        top: 59px;
        left: 75px;
        font-size: 59px;
        line-height: 0.98;
        font-weight: 900;
        letter-spacing: 0;
      }
      .sub {
        position: absolute;
        top: 127px;
        left: 77px;
        font-size: 17px;
        color: rgba(238,243,251,0.68);
      }
      .track {
        position: absolute;
        left: 77px;
        right: 77px;
        top: 240px;
        height: 213px;
        border-radius: 12px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
      }
      .lane {
        position: absolute;
        left: 29px;
        right: 29px;
        height: 48px;
        border-radius: 9px;
        background: rgba(255,255,255,0.04);
      }
      .lane.one { top: 27px; }
      .lane.two { top: 82px; }
      .lane.three { top: 137px; }
      .block {
        position: absolute;
        top: 8px;
        height: 32px;
        border-radius: 8px;
        opacity: 0;
        transform: scaleX(0.95);
      }
      .block.a { left: 13px; width: 240px; background: linear-gradient(90deg, #60a5fa, #7c3aed); animation: block-in 4.8s ease both; }
      .block.b { left: 287px; width: 147px; background: linear-gradient(90deg, #22c55e, #14b8a6); animation: block-in 4.8s 0.6s ease both; }
      .block.c { left: 467px; width: 240px; background: linear-gradient(90deg, #f59e0b, #f97316); animation: block-in 4.8s 1.1s ease both; }
      .block.d { left: 747px; width: 280px; background: linear-gradient(90deg, #f472b6, #ec4899); animation: block-in 4.8s 1.6s ease both; }
      .playhead {
        position: absolute;
        top: 220px;
        left: 77px;
        width: 4px;
        height: 273px;
        background: #dbeafe;
        border-radius: 999px;
        box-shadow: 0 0 0 8px rgba(219,234,254,0.08);
        animation: playhead 4.8s linear both;
      }
      .tick {
        position: absolute;
        bottom: 43px;
        left: 77px;
        right: 77px;
        height: 2px;
        background: linear-gradient(90deg, rgba(255,255,255,0.1), rgba(255,255,255,0.5), rgba(255,255,255,0.1));
      }
      @keyframes block-in {
        0% { opacity: 0; transform: scaleX(0.96); }
        14% { opacity: 1; transform: scaleX(1); }
        100% { opacity: 1; transform: scaleX(1); }
      }
      @keyframes playhead {
        0% { transform: translateX(0); }
        100% { transform: translateX(calc(100vw - 232px)); }
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="timeline"
      data-start="0"
      data-duration="4.8"
      data-width="1280"
      data-height="720"
      data-no-timeline
    >
      <div class="header clip" id="timeline-header" data-start="0" data-duration="4.8">Timeline animation</div>
      <div class="sub clip" id="timeline-subtitle" data-start="0" data-duration="4.8">Blocks enter, the playhead sweeps, and the sequence resolves.</div>
      <div class="track clip" id="timeline-track" data-start="0" data-duration="4.8">
        <div class="lane one">
          <div class="block a"></div>
        </div>
        <div class="lane two">
          <div class="block b"></div>
        </div>
        <div class="lane three">
          <div class="block c"></div>
          <div class="block d"></div>
        </div>
      </div>
      <div class="playhead clip" id="timeline-playhead" data-start="0" data-duration="4.8"></div>
      <div class="tick"></div>
    </div>
  </body>
</html>
