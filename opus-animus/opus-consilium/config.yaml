# ── CONTENT COLLECTOR ──────────────────────────────────────────────────────────
# Batch riêng, chạy 05:30, độc lập với Module A (ResearchCrew 06:00)
# python run_collect.py [--dry-run] [--no-ingest]

collect:
  max_articles_per_source: 10
  ingest_batch_limit: 15       # max wiki pages/run — giới hạn Groq free tier
  notify_top_n: 5
  auto_ingest: false           # gate raw -> wiki through run_wiki.py audit-research
  goal_filter:
    enabled: true
    goal: >
      I want a personal daily AI market radar that helps me decide what to read, test, compare, save, or ignore today.
      Prioritize major AI market changes from OpenAI, Anthropic, Microsoft, Google, GitHub, AWS, NVIDIA, and important open-source tools.
      Keep items that change my understanding of AI agents, coding tools, model capabilities, enterprise adoption, pricing, governance, or workflow automation.
      Drop noise, minor research papers, and generic posts unless they contain a practical idea I can test in my current AI work.
      Evaluate each article for: (1) whether it changes my next action, (2) whether it is a major market move,
      (3) whether it reveals a useful tool or workflow pattern, (4) whether it is worth saving for later thinking.
    min_score: 3               # 1-5: drop score < 3 (noise/tangential)

collect_sources:
